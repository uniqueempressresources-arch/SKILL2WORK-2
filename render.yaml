services:
  - type: web
    name: skill2work-api
    runtime: node
    buildCommand: npm install --include=dev && npm run build -w apps/api
    preDeployCommand: npm run auth:migrate -w apps/api && npm run db:migrate -w apps/api
    startCommand: npm run start -w apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 10000
      - key: CLIENT_ORIGIN
        fromService:
          name: skill2work-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: skill2work-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        fromService:
          name: skill2work-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: AI_ENABLED
        value: "false"
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false

  - type: worker
    name: skill2work-worker
    runtime: node
    buildCommand: npm install --include=dev && npm run build -w apps/api
    startCommand: npm run worker -w apps/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: skill2work-db
          property: connectionString
      - key: WORKER_POLL_MS
        value: "5000"
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: AI_ENABLED
        value: "false"
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
 
    
  - type: web
    name: skill2work-web
    runtime: static
    buildCommand: npm install --include=dev && npm run build -w apps/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: skill2work-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: skill2work-db
    databaseName: skill2work
    user: skill2work
